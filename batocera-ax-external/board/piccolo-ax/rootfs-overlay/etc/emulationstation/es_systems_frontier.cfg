<?xml version="1.0"?>
<systemList>
  <system>
    <name>frontier</name>
    <fullname>Frontier: Elite II</fullname>
    <manufacturer>Gametek / Konami</manufacturer>
    <release>1993</release>
    <hardware>computer</hardware>
    <path>/userdata/roms/frontier</path>
    <extension>.fe2 .game</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM%</command>
