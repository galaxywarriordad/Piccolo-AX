<?xml version="1.0"?>
<systemList>
  <system>
    <name>megadrive</name>
    <fullname>Sega Mega Drive</fullname>
    <manufacturer>Sega</manufacturer>
    <release>1988</release>
    <hardware>console</hardware>
    <path>/userdata/roms/megadrive</path>
    <extension>.md .bin .gen .smd .zip .7z</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM%</command>
    <platform>megadrive</platform>
    <theme>megadrive</theme>
    <emulators>
      <emulator name="ax">
        <cores>
          <core default="true">blastem</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
