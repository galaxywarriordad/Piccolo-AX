Section "ServerLayout"
    Identifier "PiccoloLayout"
    Screen 0 "PrimaryScreen" 0 0
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "True"
    Option "AutoAddGPU" "False"
    Option "DontVTSwitch" "True"
EndSection

Section "Device"
    Identifier "NvidiaGTX980Ti"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowFlipping" "True"
    Option "TripleBuffer" "False"
    Option "AllowEmptyInitialConfiguration" "True"
EndSection

Section "Device"
    Identifier "IntelUHD630"
    Driver "modesetting"
    BusID "PCI:0:2:0"
    Option "AccelMethod" "none"
EndSection

Section "Screen"
    Identifier "PrimaryScreen"
    Device "NvidiaGTX980Ti"
EndSection
