set default="0"
set timeout="1"

menuentry "Piccolo [AX] — Real-Time Bare-Metal Console (toram)" {
    linux /boot/linux label=BATOCERA console=tty3 quiet loglevel=3 vt.global_cursor_default=0 \
        isolcpus=managed_irq,domain,0-4 nohz_full=0-4 rcu_nocbs=0-4 \
        default_hugepagesz=1G hugepagesz=1G hugepages=6 hugepagesz=2M hugepages=1024 \
        processor.max_cstate=0 skew_tick=1 pcie_aspm=off mitigations=off \
        usbcore.autosuspend=-1 usbhid.jspoll=1 piccolo.rootfs=rootfs.erofs
    initrd /boot/initrd.lz4
}

menuentry "Piccolo [AX] — Fallback A/B Image (rootfs.erofs.prev)" {
    linux /boot/linux label=BATOCERA console=tty3 quiet loglevel=3 vt.global_cursor_default=0 \
        isolcpus=managed_irq,domain,0-4 nohz_full=0-4 rcu_nocbs=0-4 \
        default_hugepagesz=1G hugepagesz=1G hugepages=6 hugepagesz=2M hugepages=1024 \
        processor.max_cstate=0 skew_tick=1 pcie_aspm=off mitigations=off \
        usbcore.autosuspend=-1 usbhid.jspoll=1 piccolo.rootfs=rootfs.erofs.prev
    initrd /boot/initrd.lz4
}
