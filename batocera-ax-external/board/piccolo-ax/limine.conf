timeout: 3
default_entry: 1
remember_last_entry: yes

/Audio & Synth [flac_ax + ax_av_studio]
    protocol: linux
    path: boot():/boot/bzImage
    module_path: boot():/boot/initrd.lz4
    cmdline: root=/dev/ram0 toram isolcpus=managed_irq,domain,0-4 nohz_full=0-4 rcu_nocbs=0-4 default_hugepagesz=1G hugepagesz=1G hugepages=6 hugepagesz=2M hugepages=1024 processor.max_cstate=0 skew_tick=1 pcie_aspm=off mitigations=off usbcore.autosuspend=-1 usbhid.jspoll=1 ax.mode=audio ax.dac_lock=/run/lock/ax-dac.lock

