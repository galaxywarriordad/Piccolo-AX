name: Test ax-snes-launch.sh (Syntax, ShellCheck & No-Args Exit Code 2)

on:
  push:
    branches: [main]
    paths:
      - "batocera-ax-external/package/genx-snes-ax/**"
      - ".github/workflows/test-ax-snes-launch.yml"
  pull_request:
    branches: [main]
    paths:
      - "batocera-ax-external/package/genx-snes-ax/**"
      - ".github/workflows/test-ax-snes-launch.yml"
  workflow_dispatch:

jobs:
  test-ax-snes-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Piccolo-AX
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Fetch and Verify ax-snes-launch.sh (Syntax, ShellCheck & Exit Code 2)
        run: |
          set -euo pipefail
          LAUNCHER="/tmp/ax-snes-launch.sh"
          curl -fsSL \
            "https://raw.githubusercontent.com/galaxywarriordad/Generation-X-AX/main/scripts/ax-snes-launch.sh" \
            -o "${LAUNCHER}"

          chmod +x "${LAUNCHER}"
          sh -n "${LAUNCHER}"
          shellcheck -x "${LAUNCHER}"

          set +e
          /bin/bash "${LAUNCHER}" >/tmp/snes_usage.out 2>&1
          rc=$?
          set -e

          echo "Exit code with no arguments: ${rc}"
          test "${rc}" -eq 2
          grep -q "Usage:" /tmp/snes_usage.out

      - name: Clean Temporary Test Artifacts
        if: always()
        run: rm -f /tmp/ax-snes-launch.sh /tmp/snes_usage.out
