name: Test ax-snes-launch.sh (Syntax, ShellCheck & No-Args Exit Code 2)

on:
  push:
    branches: [main]
    paths:
      - "batocera-ax-external/package/genx-snes-ax/**"
      - ".github/workflows/test-ax-snes-launch.yml"
  pull_request:
    branches: [main]
    paths:
      - "batocera-ax-external/package/genx-snes-ax/**"
      - ".github/workflows/test-ax-snes-launch.yml"
  workflow_dispatch:

jobs:
  test-ax-snes-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Piccolo-AX
        uses: actions/checkout@v5
        with:
          path: Piccolo-AX
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout Generation-X-AX
        uses: actions/checkout@v5
        with:
          repository: galaxywarriordad/Generation-X-AX
          path: Generation-X-AX
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Syntax, ShellCheck, and No-Argument Usage Check
        run: |
          set -euo pipefail
          LAUNCHER="Generation-X-AX/scripts/ax-snes-launch.sh"
          test -f "${LAUNCHER}"
          chmod +x "${LAUNCHER}"
          sh -n "${LAUNCHER}"
          shellcheck -x "${LAUNCHER}"

          set +e
          /bin/bash "${LAUNCHER}" >/tmp/snes_usage.out 2>&1
          rc=$?
          set -e

          echo "Exit code with no arguments: ${rc}"
          test "${rc}" -eq 2
          grep -q "Usage:" /tmp/snes_usage.out

      - name: Clean Temporary Test Artifacts
        if: always()
        run: rm -f /tmp/snes_usage.out
